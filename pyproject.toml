[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-model-router"
version = "0.2.0"
description = "A 3-layer cascade classifier that routes each task to the cheapest model that can handle it well — before the agent makes an API call."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Manthan Vaghela", email = "manthansinhvaghela@gmail.com" }
]
keywords = ["llm", "router", "classifier", "agents", "adk", "gemini", "claude", "openai", "cost-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
google = ["google-genai>=1.14.0"]
anthropic = ["anthropic>=0.39.0"]
openai = ["openai>=1.50.0"]
ml = [
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
]
adk = ["google-adk>=1.31.0", "google-genai>=1.14.0"]
crewai = ["crewai>=0.80.0"]
llamaindex = ["llama-index>=0.11.0"]
pydanticai = ["pydantic-ai>=0.0.14"]
dspy_ext = ["dspy>=2.5.0"]
haystack = ["haystack-ai>=2.6.0"]
semantickernel = ["semantic-kernel>=1.0.0"]
smolagents = ["smolagents>=1.0.0"]
all = [
    "dynamic-model-router[google,anthropic,openai,ml,adk,crewai]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "build>=1.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "twine>=5.0.0",
    "pip-audit>=2.7.0",
    "nbmake>=1.5.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
redis = ["redis>=5.0.0"]
kafka = ["confluent-kafka>=2.3.0"]
s3    = ["boto3>=1.34.0"]
tokenizers = ["tiktoken>=0.5.0"]
hf    = ["transformers>=4.40.0"]
all_extensions = [
    "redis>=5.0.0",
    "confluent-kafka>=2.3.0",
    "boto3>=1.34.0",
    "tiktoken>=0.5.0",
    "transformers>=4.40.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/manthan9891994/agents-multi-model-support"
Repository = "https://github.com/manthan9891994/agents-multi-model-support"
Issues = "https://github.com/manthan9891994/agents-multi-model-support/issues"

[project.scripts]
dmr = "classifier.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["classifier*", "dynamic_model_router*"]
exclude = ["tests*", "examples*", "plan_docs*", "integrations*"]

[tool.setuptools.package-data]
classifier = [
    "py.typed",
    "*.pyi",
    "*.json",
    "data/*.jsonl",
    "config/*.yaml",
    "ml/models/*.joblib",
    "ml/models/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["classifier"]
omit = [
    # CLI / dashboard scripts — exercised manually, not unit-tested
    "classifier/calibrate.py",
    "classifier/stats.py",
    # Optional pluggable backends — require Redis/Kafka/S3/webhook to test
    "classifier/cache_backends.py",
    "classifier/logger_backends.py",
    "classifier/infra/semantic_cache.py",
    "classifier/infra/personalization.py",
    # ML training pipeline — requires real data + GPU/long compute
    "classifier/ml/data_loader.py",
    "classifier/ml/generate_synthetic.py",
    "classifier/ml/train.py",
    "classifier/ml/train_head.py",
    # Optional L2 provider modules — google is the default, others are lazy
    "classifier/layers/layer2/providers/anthropic.py",
    "classifier/layers/layer2/providers/openai.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["examples", "plan_docs", "docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line-too-long — we use 110-col, ruff still flags long strings
    "B008",   # do-not-call-fn-in-default — common for FastAPI patterns
    "UP007",  # X | Y syntax — keep Optional for clarity in stubs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "F401"]
"classifier/__init__.py" = ["F401", "E402"]   # re-exports + __version__-first pattern

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = false
exclude = ["examples/", "plan_docs/", "docs/", "tests/"]
