name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev,google,anthropic,openai]"
          # Pin ruff — formatting can change between versions, so an unpinned
          # `pip install ruff` makes `ruff format --check` non-deterministic in CI.
          pip install "ruff==0.15.12" mypy
      - name: Ruff check
        run: ruff check classifier/ tests/
      - name: Ruff format check
        run: ruff format --check classifier/ tests/
      - name: Mypy
        run: mypy classifier/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # advisory until type coverage hits 80%

  security:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit --skip-editable --strict || true
        continue-on-error: true   # advisory; security fixes get their own PRs

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          # Reduce runner minutes — only test latest Python on macOS/Windows
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev,google,anthropic,openai]"
      - name: Run tests with coverage
        env:
          CLASSIFIER_TEST_MODE: "1"
        run: |
          pytest tests/ -v --tb=short --cov=classifier --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  notebook:
    name: Verify quickstart notebook
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev,google,anthropic,openai]"
          pip install nbmake jupyter
      - name: Run quickstart.ipynb
        env:
          CLASSIFIER_TEST_MODE: "1"
        run: |
          # Skip cells that need API keys (they print messages but don't fail)
          pytest --nbmake examples/quickstart.ipynb --nbmake-timeout=60 || true

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: pip install build twine
      - name: Build wheel + sdist
        run: python -m build
      - name: Check dist
        run: twine check dist/*
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
